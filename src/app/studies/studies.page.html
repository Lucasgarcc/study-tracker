<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar style="--background: var(--orbit-chrome-gradient); --color: var(--orbit-text-main); --border-color: transparent;">
    <ion-title class="ion-padding-start">Área de Estudos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--background: var(--orbit-bg-effect);">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar style="--background: var(--orbit-chrome-gradient); --color: var(--orbit-text-main); --border-color: transparent;">
      <ion-title size="large">Área de Estudos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Container principal centralizado (Padrão Apple Human Interface Guidelines) -->
  <div style="max-width: 600px; margin: 0 auto; padding-bottom: 48px;">

    <!-- Seção: Formulário para Adicionar Novo Tópico -->
    <ion-card class="orbit-card" style="background: var(--orbit-card-bg) !important; backdrop-filter: blur(16px); border: 1px solid var(--orbit-card-border); border-radius: 20px; padding: 24px; margin-bottom: 32px; box-shadow: var(--orbit-shadow-2);">
      
      <!-- Cabeçalho do Card com espaçamento limpo estilo Apple (subtitle menor e tracked, title com respiro ideal) -->
      <div style="margin-bottom: 24px;">
        <div style="color: var(--orbit-accent); font-size: 0.75rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 6px;">
          Gerenciamento
        </div>
        <h2 style="color: var(--orbit-text-main); font-size: 1.35rem; font-weight: 600; letter-spacing: -0.3px; margin: 0;">
          Novo Tópico de Estudo
        </h2>
      </div>

      <!-- Formulário -->
      <form (ngSubmit)="addNewTopic()">
        
        <!-- Input com espaçamento interno ideal e respiro inferior de 16px (Apple Stack Spacing) -->
        <ion-item class="orbit-input-item" lines="none" style="--background: var(--orbit-bg-surface-variant); border: 1px solid var(--orbit-card-border); border-radius: 14px; margin-bottom: 16px; --padding-start: 16px; --padding-end: 16px; --padding-top: 8px; --padding-bottom: 8px;">
          <ion-input 
            label="Título do Tópico" 
            label-placement="stacked" 
            placeholder="Ex: Angular Standalone" 
            [(ngModel)]="newTitle" 
            name="title" 
            required
            style="--color: var(--orbit-text-main); --placeholder-color: var(--orbit-text-muted);">
          </ion-input>
        </ion-item>

        <!-- Select com respiro de 24px antes do botão de ação principal -->
        <ion-item class="orbit-input-item" lines="none" style="--background: var(--orbit-bg-surface-variant); border: 1px solid var(--orbit-card-border); border-radius: 14px; margin-bottom: 24px; --padding-start: 16px; --padding-end: 16px; --padding-top: 8px; --padding-bottom: 8px;">
          <ion-select 
            label="Categoria" 
            label-placement="stacked" 
            placeholder="Selecione a categoria" 
            [(ngModel)]="newCategory" 
            name="category"
            style="--color: var(--orbit-text-main); --placeholder-color: var(--orbit-text-muted);">
            <ion-select-option value="Frontend">Frontend</ion-select-option>
            <ion-select-option value="Architecture">Arquitetura</ion-select-option>
            <ion-select-option value="Reactive">Reativo / RxJS</ion-select-option>
            <ion-select-option value="Backend">Backend</ion-select-option>
          </ion-select>
        </ion-item>

        <!-- Botão com altura ergonômica (50px) -->
        <ion-button expand="block" type="submit" style="--background: linear-gradient(135deg, var(--orbit-button-start) 0%, var(--orbit-accent) 100%); --border-radius: 14px; height: 50px; font-weight: 600; font-size: 1rem; text-transform: none; box-shadow: 0 4px 20px rgba(95, 141, 255, 0.24);">
          <ion-icon name="add-outline" slot="start" style="font-size: 20px; margin-right: 8px;"></ion-icon>
          Cadastrar Tópico
        </ion-button>
      </form>
    </ion-card>

    <!-- Seção: Lista de Tópicos Cadastrados com hierarquia clara -->
    <div>
      <h3 class="topic-list-title">
        Tópicos Cadastrados
      </h3>

      <ion-list lines="none" style="background: transparent; padding: 0;">
        <ion-item *ngFor="let topic of topics$ | async" class="orbit-card topic-card" style="--background: var(--orbit-topic-card-bg); --color: var(--orbit-text-main); background: var(--orbit-topic-card-bg) !important; backdrop-filter: blur(16px); border: 1px solid var(--orbit-topic-card-border); border-radius: 14px; margin-bottom: 12px; --padding-start: 16px; --padding-end: 16px; --padding-top: 12px; --padding-bottom: 12px;">
          <ion-label style="margin: 6px 0;">
            <h2 style="color: var(--orbit-text-main); font-weight: 600; font-size: 1.05rem; margin-bottom: 6px; letter-spacing: -0.2px;">{{ topic.title }}</h2>
            <p style="color: var(--orbit-text-muted); font-size: 0.875rem;">
              <ion-text color="primary" style="font-weight: 500;">[{{ topic.category }}]</ion-text> • Progresso: {{ topic.progress }}%
            </p>
          </ion-label>
          
          <ion-button fill="clear" color="primary" slot="end" (click)="deleteTopic(topic.id)" aria-label="Remover tópico" style="margin-left: 8px;">
            <ion-icon name="remove-circle-outline" slot="icon-only" style="font-size: 20px;"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>
    </div>

  </div>
</ion-content>
